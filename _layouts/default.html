<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />

    <title>
      {% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}
    </title>

    <meta name="author" content="{{ site.name }}" />
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.name }}{% else %}{{ site.name }} · {{ site.description }}{% endif %}" />
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:image" content="{{ page.og_image | default: site.og_image | default: site.avatar }}" />
    <meta property="og:locale" content="ko_KR" />
    {% if page.layout == 'post' %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
    <meta property="article:author" content="{{ site.name }}" />
    {% for tag in page.tags %}<meta property="article:tag" content="{{ tag }}" />
    {% endfor %}{% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} — {{ site.name }}{% else %}{{ site.name }} · {{ site.description }}{% endif %}" />
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />
    <meta name="twitter:image" content="{{ page.og_image | default: site.og_image | default: site.avatar }}" />

    <!-- Canonical -->
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="{{ site.baseurl }}/style.css"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }} – {{ site.description }}"
      href="{{ site.baseurl }}/feed.xml"
    />

    <script type="text/javascript" src="/js/jquery-1.11.1.min.js"></script>
    <script defer src="/js/alexpearce.js"></script>
  </head>

  <body>
    <div class="wrapper-masthead" id="site-nav">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar">
            <img src="{{ site.avatar }}" alt="{{ site.name }}" />
          </a>

          <div class="site-info">
            <h1 class="site-name">
              <a href="{{ site.baseurl }}/">{{ site.name }}</a>
            </h1>
          </div>

          <nav>
            <a href="/#about"      data-spy="about">About</a>
            <a href="/#skills"     data-spy="skills">Skills</a>
            <a href="/#projects"   data-spy="projects">Projects</a>
            <a href="/#experience" data-spy="experience">Experience</a>
            <a href="/#contact"    data-spy="contact">Contact</a>
            <a href="https://velog.io/@jyg3485" target="_blank" class="nav-pill">Velog</a>
            <a href="https://github.com/teriyakki-jin" target="_blank" class="nav-pill">GitHub</a>
            <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환" title="테마 전환">
              <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">{{ content }}</div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          <div class="footer-icons">{% include svg-icons.html %}</div>
          <p class="footer-copy">© {{ site.time | date: "%Y" }} {{ site.name }} · Built with Jekyll</p>
        </footer>
      </div>
    </div>

    {% include analytics.html %}

    <script src="{{ site.baseurl }}/js/neural-bg.js"></script>
    <script src="{{ site.baseurl }}/js/star-field.js"></script>
    <script src="{{ site.baseurl }}/js/typewriter.js"></script>

    <script>
      // Sticky nav: transparent → blur on scroll
      (function () {
        var nav = document.getElementById('site-nav');
        if (!nav) return;
        function onScroll() {
          if (window.scrollY > 40) nav.classList.add('scrolled');
          else nav.classList.remove('scrolled');
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      })();
    </script>

    <script>
      // Scroll reveal (fade-up) + skill bar animation
      (function () {
        if (!('IntersectionObserver' in window)) return;

        // Fade-up for cards and posts
        var targets = document.querySelectorAll('.project-card, .posts > .post, .edu-item, .about-intro, .skill-card, .exp-card');
        targets.forEach(function (el, i) {
          el.style.transitionDelay = Math.min(i * 0.07, 0.42) + 's';
          el.classList.add('fade-up');
        });

        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              e.target.classList.add('in-view');
              obs.unobserve(e.target);
            }
          });
        }, { threshold: 0.07 });

        targets.forEach(function (el) { obs.observe(el); });

        // Skill bar fill animation
        var skillCards = document.querySelectorAll('.skill-card');
        var barObs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              e.target.querySelectorAll('.skill-bar-fill').forEach(function (bar) {
                bar.style.width = bar.getAttribute('data-width');
              });
              barObs.unobserve(e.target);
            }
          });
        }, { threshold: 0.25 });

        skillCards.forEach(function (el) { barObs.observe(el); });

        // Count-up for stats and quick-stats
        var statEls = document.querySelectorAll('.stat-num, .qs-num');
        var countObs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            var el    = e.target;
            var end   = parseInt(el.getAttribute('data-count'), 10);
            var suf   = el.getAttribute('data-suffix') || '';
            var dur   = 1400;
            var step  = 16;
            var inc   = end / (dur / step);
            var cur   = 0;
            var timer = setInterval(function () {
              cur += inc;
              if (cur >= end) { cur = end; clearInterval(timer); }
              el.textContent = Math.floor(cur) + suf;
            }, step);
            countObs.unobserve(el);
          });
        }, { threshold: 0.5 });

        statEls.forEach(function (el) { countObs.observe(el); });
      })();
    </script>

    <script>
      // Scroll-spy nav
      (function () {
        if (!document.getElementById('hero-canvas')) return; // home page only
        var sections = Array.from(document.querySelectorAll('section[id]'));
        var links    = document.querySelectorAll('nav a[data-spy]');
        if (!sections.length || !links.length) return;

        function update() {
          var trigger = window.scrollY + window.innerHeight * 0.32;
          var current = '';
          sections.forEach(function (sec) {
            if (sec.offsetTop <= trigger) current = sec.id;
          });
          links.forEach(function (a) {
            a.classList.toggle('nav-active', a.dataset.spy === current);
          });
        }

        window.addEventListener('scroll', update, { passive: true });
        update();
      })();

      // Theme toggle
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme') || 'dark';
          var next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        });
      })();

      // Copy email button
      (function () {
        var btn = document.getElementById('copy-email-btn');
        if (!btn) return;
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText('jyeg3485@gmail.com').then(function () {
            btn.classList.add('copied');
            document.getElementById('copy-label').textContent = '복사됨 ✓';
            setTimeout(function () {
              btn.classList.remove('copied');
              document.getElementById('copy-label').textContent = '복사';
            }, 2000);
          });
        });
      })();
    </script>
  </body>
</html>
